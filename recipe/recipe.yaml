schema_version: 1

context:
  version: "2.10.4"

package:
  name: e3sm-quickview
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/5d/b3/1a3d9f8c4662b6bdb646ef3179c37a0a5ab244019f9dd5cccbf46b6dc524/e3sm_quickview-${{ version }}.tar.gz
  sha256: d921995d5eb19a1185c3f97166693d708cf986c34364f2a4985b90b13f140184

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - quickview = e3sm_quickview.app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - paraview >=6
    - hdf5 <2
    - wslink >=2.5.7
    - trame >=3.13.2
    - trame-rca >=2.6
    - trame-vuetify >=3.1
    - pyproj >=3.6.1
    - netcdf4 >=1.6.5
    - trame-dataclass >=2.0.2
    - trame-components
    - trame-tauri >=0.6.2
    - trame-colormaps >=1.7.2
    - pillow

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - e3sm_quickview
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - quickview --help

about:
  summary: An application to explore/analyze data for atmosphere component for E3SM
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/e3sm-quickview/

extra:
  recipe-maintainers:
    - huiwanpnnl
    - jourdain
    - psavery
    - alesgenova
