schema_version: 1

context:
  version: "2.8.2"

package:
  name: e3sm-quickview
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/48/5f/566bf9b2dbc1053060ee3c15b3d65f8295ded0ba78868eb02a98036dd580/e3sm_quickview-${{ version }}.tar.gz
  sha256: a814b14ef0fc0e841505dc23c3facea6ac48a81002ea09f3cd84ccfc125d6888

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - quickview = e3sm_quickview.app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - paraview >=6
    - trame >=3.12
    - trame-rca >=2.3.1
    - trame-vuetify >=3.1
    - pyproj >=3.6.1
    - netcdf4 >=1.6.5
    - trame-dataclass >=2.0.1
    - trame-components
    - trame-tauri >=0.6.2
    - trame-colormaps >=1.1.1
    - pillow

tests:
  - python:
      imports:
        - e3sm_quickview
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - quickview --help

about:
  summary: An application to explore/analyze data for atmosphere component for E3SM
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/e3sm-quickview/

extra:
  recipe-maintainers:
    - huiwanpnnl
    - jourdain
    - psavery
    - alesgenova
